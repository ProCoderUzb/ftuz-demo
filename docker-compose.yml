# Production stack: `cp .env.example .env`, fill it in, then `docker compose up -d --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ftuz
      POSTGRES_USER: ftuz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftuz -d ftuz"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: ftuz-api
    env_file: .env
    environment: &api-env
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      DATABASE_URL: postgres://ftuz:${POSTGRES_PASSWORD}@db:5432/ftuz
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Creates due repeating-payment transactions. Idempotent, so running it hourly is safe.
  scheduler:
    image: ftuz-api
    env_file: .env
    environment: *api-env
    command: >
      sh -c "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done;
             while true; do python manage.py run_recurring; sleep 3600; done"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
