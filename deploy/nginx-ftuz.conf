# /etc/nginx/sites-available/ftuz  (then: ln -s ../sites-available/ftuz /etc/nginx/sites-enabled/)
# HTTPS for both names: certbot --nginx -d ft.educationpro.uz -d ftapi.educationpro.uz --redirect

upstream ftuz_api {
    server 127.0.0.1:8000;
}

# Frontend: the React app (static files only; it calls the API on ftapi.educationpro.uz)
server {
    listen 80;
    listen [::]:80;
    server_name ft.educationpro.uz;

    root /srv/ftuz/frontend/dist;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # Every other path is a client-side route
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri /index.html;
    }
}

# Backend: Django API, admin and the admin's static files
server {
    listen 80;
    listen [::]:80;
    server_name ftapi.educationpro.uz;

    client_max_body_size 2m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    # Admin CSS/JS, produced by `manage.py collectstatic`
    location /static/ {
        alias /srv/ftuz/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://ftuz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrites anything the client sent, so Django can trust it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
